<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>TDR · Vídeos de YouTube para revisar</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111111;color:#F2EEE4;font:16px/1.45 "Segoe UI",Arial,sans-serif;padding:16px;box-sizing:border-box}
form{width:min(420px,100%);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:28px 28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
h1{margin:0 0 6px;font-size:23px}p{margin:0 0 18px;color:#BDB6A6;font-size:15px}.ban{height:6px;border-radius:3px;margin-bottom:18px;background:linear-gradient(90deg,#D80211,#FF6B5A,#D80211)}
label{display:block;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#FF6B5A;margin-bottom:6px}
input{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;font-size:17px}
button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:8px;background:#D80211;color:#fff;font-weight:800;font-size:16px;cursor:pointer}
#msg{min-height:22px;margin-top:10px;font-size:14px;color:#FFB4B4}</style></head><body>
<form id="f"><div class="ban"></div><h1>TDR · Vídeos de YouTube para revisar</h1><p>Página privada. Escribe la contraseña que te han enviado.</p>
<label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" autofocus required>
<button type="submit">Entrar</button><div id="msg" role="status"></div></form>
<script>
(() => {
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();const msg=document.getElementById('msg');msg.textContent='Abriendo…';
  let plano,key;
  try{
    const man=await (await fetch('manifiesto.json',{cache:'no-store'})).json();
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value.trim().toLowerCase()),'PBKDF2',false,['deriveKey']);
    key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(man.sal),iterations:man.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const b=new Uint8Array(await (await fetch(man.doc+'?v='+man.v,{cache:'no-store'})).arrayBuffer());
    plano=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12));
  }catch(err){msg.textContent='Contraseña incorrecta. Vuelve a probar.';return}
  msg.textContent='Cargando…';
  const html=await new Response(new Blob([plano]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  window.__K=key;
  document.open();document.write(html);document.close();
});
})();
</script></body></html>
